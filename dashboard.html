<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeZone stocks</title>
<style>
:root {
  color-scheme: dark;
  /* surfaces and ink: dataviz dark chrome, anchored on the dofus-bot dashboard */
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2b2b29;
  --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .15);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #929089; --grid: #2c2c2a; --axis: #383835;
  --accent: #8fd46c; --accent-soft: rgba(143, 212, 108, .12);
  /* status (fixed), always with an icon and a label */
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --pos-text: #2fbf4a; --neg-text: #ef7d7d;
  /* strategies: categorical slots 1 to 6 (dark), validated, fixed per strategy */
  --s-top: #3987e5; --s-crash: #d95926; --s-surv: #199e70; --s-mom: #c98500; --s-dip: #d55181; --s-manuel: #008300;
  /* diverging (heat map): blue up, red down, gray midpoint */
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835;
  --r: 8px; --gap: 12px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 var(--font); }
a { color: inherit; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 14px; height: 14px; }

/* top bar */
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 20px; background: rgba(13, 13, 13, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; letter-spacing: .01em; }
.brand .ico { color: var(--accent); }
nav { display: flex; gap: 2px; }
nav a { text-decoration: none; color: var(--ink-2); padding: 5px 10px; border-radius: 6px; }
nav a:hover { background: var(--surface-2); color: var(--ink); }
nav a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--ink-2); flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; color: var(--ink); white-space: nowrap; }
.pill.good .ico { color: var(--good); } .pill.warning .ico { color: var(--warning); } .pill.critical .ico { color: var(--critical); } .pill.serious .ico { color: var(--serious); }
.livedot { display: inline-block; vertical-align: middle; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.livedot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.meta { font-variant-numeric: tabular-nums; white-space: nowrap; }

main { padding: 16px 20px 48px; max-width: 1680px; margin: 0 auto; }
section { margin-top: 28px; scroll-margin-top: 64px; }
section > h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--ink); }
section > h2 .ico { color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.card { grid-column: span 4; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 14px 12px; min-width: 0; }
.w2 { grid-column: span 2; } .w3 { grid-column: span 3; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w9 { grid-column: span 9; } .w12 { grid-column: span 12; }
@media (max-width: 1200px) { .card, .w2, .w3, .w5 { grid-column: span 6; } .w6, .w7, .w8, .w9, .w12 { grid-column: span 12; } }
@media (max-width: 720px) { main, header { padding-left: 16px; padding-right: 16px; } .card, .w2, .w3, .w5, .w6, .w7, .w8, .w9 { grid-column: span 12; } nav { display: none; } }
.card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.card h3 .sub { font-weight: 400; color: var(--muted); }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* hero and tiles */
.hero { display: flex; flex-direction: column; gap: 6px; }
.hero .label { color: var(--ink-2); }
.hero .big { font-size: 48px; line-height: 1.05; font-weight: 600; letter-spacing: -.02em; }
.hero .big small { font-size: 18px; color: var(--ink-2); font-weight: 500; margin-left: 6px; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; }
.pos { color: var(--pos-text); } .neg { color: var(--neg-text); } .mut { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; }
.tile .k { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
.tile .s { color: var(--muted); font-size: 12px; }

/* tables */
.tbl-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
td { padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.num { text-align: right; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.hpbar { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-3); vertical-align: middle; overflow: hidden; }
.hpbar i { display: block; height: 100%; border-radius: 3px; }

/* bars and meters */
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hb { display: grid; grid-template-columns: 128px 1fr 84px; align-items: center; gap: 8px; }
.hb .lab { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .track { position: relative; height: 14px; }
.hb .track .zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.hb .track i { position: absolute; top: 0; height: 100%; border-radius: 0 4px 4px 0; }
.hb .track i.l { border-radius: 4px 0 0 4px; }
.hb .val { text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 5px; background: var(--surface-3); position: relative; overflow: visible; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }

/* charts */
svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart text { fill: var(--muted); font: 11px var(--font); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 9px; font-size: 12px; color: var(--ink); white-space: pre; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); display: none; font-variant-numeric: tabular-nums; }

/* heat map */
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 2px; }
.heat div { padding: 6px 7px; border-radius: 4px; font-size: 11px; line-height: 1.25; cursor: default; overflow: hidden; }
.heat div b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.heat div span { color: var(--ink); opacity: .92; }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); column-gap: 24px; }
.roster .flags { display: inline-flex; gap: 8px; min-width: 150px; font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1px solid var(--border-strong); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font: inherit; cursor: pointer; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); border-color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.err-banner { display: none; margin: 12px 20px 0; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); align-items: center; gap: 8px; }
.err-banner .ico { color: var(--critical); }
@media (prefers-reduced-motion: no-preference) { .flash { animation: fl 1.2s ease-out; } @keyframes fl { from { background: var(--accent-soft); } to { background: transparent; } } }
</style>
</head>

<header>
  <div class="brand"><svg class="ico"><use href="#i-activity"/></svg>SafeZone stocks</div>
  <nav aria-label="Sections">
    <a href="#portfolio">Portfolio</a><a href="#strategies">Strategies</a><a href="#market">Market</a><a href="#game">Game</a><a href="#engine">Engine</a>
  </nav>
  <div class="bar-right" role="status" aria-live="polite">
    <span id="engine-pill" class="pill"><svg class="ico sm"><use href="#i-power"/></svg>Connecting</span>
    <span class="meta"><span id="livedot" class="livedot"></span></span>
    <span class="meta" id="updated">waiting</span>
    <span class="meta" id="countdown"></span>
  </div>
</header>
<div class="err-banner" id="err"><svg class="ico"><use href="#i-circle-x"/></svg><span id="err-text"></span></div>

<main>
  <section id="portfolio">
    <h2><svg class="ico"><use href="#i-wallet"/></svg>Portfolio</h2>
    <div class="grid">
      <div class="card w3" id="m-hero"></div>
      <div class="card w9" id="m-tiles"></div>
      <div class="card w8" id="m-equity"></div>
      <div class="card" id="m-alloc"></div>
      <div class="card w12" id="m-positions"></div>
    </div>
  </section>

  <section id="strategies">
    <h2><svg class="ico"><use href="#i-target"/></svg>Strategies</h2>
    <div class="grid">
      <div class="card w5" id="m-stratpnl"></div>
      <div class="card w3" id="m-trial"></div>
      <div class="card" id="m-gate"></div>
      <div class="card w7" id="m-top"></div>
      <div class="card w5" id="m-crash"></div>

<div id="tip" role="tooltip"></div>

<script>
'use strict';
// ---------- formatting (numbers en-US, 24 h clock)
const nf2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const cx = (c) => c == null ? '-' : nf2.format(c / 100);
const cxs = (c) => c == null ? '-' : (c > 0 ? '+' : c < 0 ? '−' : '') + nf2.format(Math.abs(c) / 100);
const pct = (x, d = 1) => x == null || !isFinite(x) ? '-' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(d) + '%';
const cls = (x) => x == null ? 'mut' : x > 0 ? 'pos' : x < 0 ? 'neg' : 'mut';
const hm = (t) => t ? new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '-';
const hms = (t) => t ? new Date(t).toLocaleTimeString('en-GB') : '-';
const ago = (ms) => ms == null ? '-' : ms < 60e3 ? `${Math.round(ms / 1e3)}s` : ms < 3600e3 ? `${Math.round(ms / 60e3)} min` : `${(ms / 3600e3).toFixed(1)} h`;
const dur = (ms) => { if (ms == null || ms < 0) return '-'; const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 3600e3), m = Math.floor(ms % 3600e3 / 60e3); return d ? `${d}d ${h}h` : h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m} min`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (n, c = '') => `<svg class="ico sm ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const STRATS = { top: 'Top basket', crash: 'Crash', surv: 'Survivors', mom: 'Momentum', dip: 'Rebound (old)', manuel: 'Manual' };
const scol = (k) => `var(--s-${STRATS[k] ? k : 'manuel'})`;
const stag = (k) => `<span class="tag"><i class="sw" style="background:${scol(k)}"></i>${esc(STRATS[k] || k)}</span>`;
const empty = (t) => `<div class="empty">${esc(t)}</div>`;
const card = (icon, title, sub, body) => `<h3><span class="tag">${ico(icon)}${esc(title)}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</h3>${body}`;
const STATUS_ICO = { good: 'circle-check', warning: 'triangle-alert', serious: 'triangle-alert', critical: 'circle-x' };
const status = (kind, label) => `<span class="tag"><svg class="ico sm" style="color:var(--${kind})" aria-hidden="true"><use href="#i-${STATUS_ICO[kind]}"/></svg><span>${esc(label)}</span></span>`;

// ---------- charts (inline SVG). Lines 2px, hairline grid, columns <= 24px with 4px rounded top.
const charts = {};
let chartSeq = 0;
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag, lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
// charts are drawn at their card's real width (W), so axis text stays 11px on a phone
const wOf = (id) => Math.max(260, (document.getElementById(id)?.clientWidth || 828) - 30);
function lineChart({ series, height = 200, yFmt = (v) => v, refs = [], yMin, W = 800 }) {
  const id = 'c' + (++chartSeq), H = height, L = 52, R = 12, T = 10, B = 22;
  const pts = series.flatMap((s) => s.pts);
  if (pts.length < 2) return empty('Not enough points yet');
  let x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0]));
  let y0 = Math.min(...pts.map((p) => p[1]), ...refs.map((r) => r.v)), y1 = Math.max(...pts.map((p) => p[1]), ...refs.map((r) => r.v));
  if (yMin != null) y0 = Math.min(y0, yMin);
  const ticks = niceTicks(y0, y1); y0 = ticks[0]; y1 = ticks.at(-1);
  const X = (t) => L + (t - x0) / Math.max(1, x1 - x0) * (W - L - R), Y = (v) => T + (1 - (v - y0) / Math.max(1e-9, y1 - y0)) * (H - T - B);
  let g = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`).join('');
  const xn = W < 500 ? 2 : 4, xt = []; for (let i = 0; i <= xn; i++) { const t = x0 + (x1 - x0) * i / xn; xt.push(`<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === xn ? 'end' : 'middle'}">${hm(t)}</text>`); }
  g += refs.map((r) => `<line x1="${L}" x2="${W - R}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="var(--ink-2)" stroke-width="1"/><text x="${W - R}" y="${Y(r.v) - 4}" text-anchor="end" style="fill:var(--ink-2)">${esc(r.label)}</text>`).join('');
  const lines = series.map((s) => {
    // a gap over 15 min (no data recorded) breaks the line instead of drawing a straight slope across it
    const d = s.pts.map((p, i) => `${i && p[0] - s.pts[i - 1][0] <= 15 * 60e3 ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    const last = s.pts.at(-1);
    const area = s.area && !d.slice(1).includes('M') ? `<path d="${d}L${X(last[0])},${Y(y0)}L${X(s.pts[0][0])},${Y(y0)}Z" fill="${s.color}" opacity=".10"/>` : '';
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('');
  charts[id] = { series, X, Y, x0, x1, L, R, W, H, T, B, yFmt };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" data-line="${id}" role="img" aria-label="${esc(series.map((s) => s.label).join(', '))}">${g}${xt.join('')}${lines}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/><rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg>` +
    (series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>` : '');
}
function columns({ bars, height = 150, yFmt = (v) => nf0.format(v), color = 'var(--s-top)', xLabel = (b) => hm(b.t), W = 800, label = 'column chart' }) {
  if (!bars.length) return empty('No data yet');
  const H = height, L = 52, R = 6, T = 8, B = 20, n = bars.length, slot = (W - L - R) / n, bw = Math.min(24, Math.max(2, slot - 2));
  const ticks = niceTicks(0, Math.max(...bars.map((b) => b.v), 1), 3), max = ticks.at(-1);
  const Y = (v) => T + (1 - v / max) * (H - T - B);
  let g = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`).join('');
  const every = Math.ceil(n / Math.max(2, Math.floor(W / 90)));
  bars.forEach((b, i) => {
    const x = L + i * slot + (slot - bw) / 2, y = Y(b.v), h = Math.max(0, Y(0) - y), r = Math.min(4, h, bw / 2);
    const d = h > 0 ? `M${x},${Y(0)}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${Y(0)}Z` : '';
    g += `<path d="${d}" fill="${b.color || color}"/><rect x="${L + i * slot}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent" data-tip="${esc(b.tip)}"/>`;
    if (i % every === 0) g += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${esc(xLabel(b))}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="${esc(label)}">${g}</svg>`;
}
function spark(vals, w = 80, h = 20) {
  if (!vals || vals.length < 2) return '<span class="mut">-</span>';
  const mn = Math.min(...vals), mx = Math.max(...vals), up = vals.at(-1) >= vals[0];
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${(i / (vals.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 2 - (v - mn) / Math.max(1e-9, mx - mn) * (h - 4)).toFixed(1)}`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(${up ? '--div-pos' : '--div-neg'})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
// diverging bars around zero (strategy PnL)
function divBars(rows, fmt) {
  if (!rows.length) return empty('No closed round trip yet');
  const m = Math.max(...rows.map((r) => Math.abs(r.v)), 1);
  return `<div class="hbars">${rows.map((r) => {
    const w = Math.abs(r.v) / m * 50;
    const bar = r.v >= 0 ? `<i style="left:50%;width:${w}%;background:${r.color}"></i>` : `<i class="l" style="right:50%;width:${w}%;background:${r.color}"></i>`;
    return `<div class="hb" data-tip="${esc(r.tip)}"><span class="lab">${r.label}</span><span class="track"><span class="zero"></span>${bar}</span><span class="val ${cls(r.v)}">${fmt(r.v)}</span></div>`;
  }).join('')}</div>`;
}
// mix capped at 55%: light ink keeps >= 4.5:1 on the strongest tile (axe, 18/10)
const heatBg = (x) => { if (x == null) return 'var(--surface-2)'; const k = Math.min(1, Math.abs(x) / 0.3); return `color-mix(in oklab, var(${x >= 0 ? '--div-pos' : '--div-neg'}) ${Math.round(12 + k * 43)}%, var(--div-mid))`; };

// ---------- tooltip (delegated)
const tip = document.getElementById('tip');
function showTip(text, ev) { tip.textContent = text; tip.style.display = 'block'; const r = tip.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14; if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
document.addEventListener('mousemove', (ev) => {
  const el = ev.target.closest('[data-tip]');
  const svg = ev.target.closest('svg[data-line]');
  document.querySelectorAll('svg[data-line] .xh').forEach((l) => { if (!svg || !svg.contains(l)) l.setAttribute('opacity', 0); });
  if (svg) {
    const c = charts[svg.dataset.line]; if (!c) return;
    const b = svg.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width * c.W;
    const t = c.x0 + (x - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
    const rows = c.series.map((s) => { let best = s.pts[0]; for (const p of s.pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; return [s.label, best]; });
    const xh = svg.querySelector('.xh'), bx = c.X(rows[0][1][0]); xh.setAttribute('x1', bx); xh.setAttribute('x2', bx); xh.setAttribute('opacity', .6);
    return showTip(`${hms(rows[0][1][0])}\n` + rows.map(([l, p]) => `${l}  ${c.yFmt(p[1])}`).join('\n'), ev);
  }
  if (el && el.dataset.tip) return showTip(el.dataset.tip, ev);
  tip.style.display = 'none';
});
document.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ---------- modules
let S = null;
const set = (id, html) => { const el = document.getElementById(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } };
const ui = { evFilter: 'all', orderFilter: 'all' };

function render() {
  if (!S) return;
  const E = S.engine, K = S.kpi, M = S.market, G = S.game, now = S.now;
  chartSeq = 0;
  // header
  const pills = { ok: ['good', 'shield-check', 'Engine running'], blocked: ['warning', 'pause', 'API paused'], auth: ['critical', 'shield-alert', 'Session lost'], down: ['critical', 'circle-x', 'Engine silent'] };
  const [pk, pi, pl] = pills[E.status] || pills.down;
  set('engine-pill', `${ico(pi)}${pl}`); document.getElementById('engine-pill').className = `pill ${pk}`;
  set('updated', `data ${ago(E.liveAge)} old`);
  set('countdown', E.end ? `event ends in ${dur(E.end - now)}` : '');

  // Portfolio
  const gain = K.value != null ? K.value - S.startCash : null;
  set('m-hero', `<div class="hero"><span class="label">Total value (Cx)</span><span class="big">${cx(K.value)}</span><span class="delta ${cls(gain)}">${cxs(gain)} Cx · ${pct(gain != null ? gain / S.startCash : null)}</span><span class="note">from ${cx(S.startCash)} Cx on 17/10 at 20:21 UTC</span></div>`);
  const tile = (icon, k, v, s, c = '') => `<div class="tile"><div class="k">${ico(icon)}${k}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`;
  const unreal = S.positions.reduce((a, p) => a + (p.pnl || 0), 0);
  set('m-tiles', card('coins', 'At a glance', '', `<div class="tiles">
    ${tile('wallet', 'Cash', cx(K.cash), 'after the latest order')}
    ${tile('layers', 'Invested', cx(K.invested), `${K.positions} positions`)}
    ${tile('trending-up', 'Unrealized PnL', cxs(unreal), 'value minus cost', cls(unreal))}
    ${tile('check', 'Closed PnL', cxs(K.tripsPnl), 'engine round trips', cls(K.tripsPnl))}
    ${tile('coins', 'Realized PnL (site)', cxs(K.realized), 'as the site counts it', cls(K.realized))}
    ${tile('scroll-text', 'Orders 24 h', nf0.format(K.ordersToday), K.trading === false ? 'trading closed by the site' : 'trading open')}
  </div>`));
  const eq = S.equity.filter((p) => p[1] != null);
  set('m-equity', eq.length > 1
    ? card('chart-line', 'Total value', 'cash and positions, one point a minute', lineChart({ series: [{ label: 'Value', color: 'var(--s-top)', pts: eq, area: true }], refs: [{ v: S.startCash, label: 'start' }], yFmt: (v) => nf0.format(v / 100), height: 210, W: wOf('m-equity') }))
    : card('chart-line', 'Cash after each order', 'until the value curve has points', S.cashCurve.length > 1 ? lineChart({ series: [{ label: 'Cash', color: 'var(--s-surv)', pts: S.cashCurve }], yFmt: (v) => nf0.format(v / 100), height: 210, W: wOf('m-equity') }) + '<div class="note">Cash drops on every buy while the value does not. The total value curve (cash and positions) takes over at 2 points, one a minute.</div>' : empty('No points yet')));
  const alloc = {};
  for (const p of S.positions) { const k = p.kind === 'dip' ? 'crash' : p.kind; alloc[k] = (alloc[k] || 0) + (p.value || 0); } // 'dip' = a crash buy in state
  const allocRows = Object.entries(alloc).sort((a, b) => b[1] - a[1]);
  const total = (K.cash || 0) + allocRows.reduce((a, r) => a + r[1], 0);
  set('m-alloc', card('layers', 'Allocation', 'share of the value', total ? `<div class="hbars">${[...allocRows, ['cash', K.cash || 0]].map(([k, v]) => `<div class="hb" data-tip="${esc(`${STRATS[k] || 'Cash'}: ${cx(v)} Cx`)}"><span class="lab">${k === 'cash' ? 'Cash' : stag(k)}</span><span class="track" style="background:var(--surface-2);border-radius:4px"><i style="left:0;width:${v / total * 100}%;background:${k === 'cash' ? 'var(--ink-2)' : scol(k)};border-radius:0 4px 4px 0"></i></span><span class="val">${(v / total * 100).toFixed(0)}%</span></div>`).join('')}</div>` : empty('Nothing to allocate')));
  const pos = [...S.positions].sort((a, b) => (b.value || 0) - (a.value || 0));
  set('m-positions', card('layers', 'Positions', `${pos.length} open`, pos.length ? `<div class="tbl-wrap" tabindex="0"><table><thead><tr><th scope="col">Stock</th><th scope="col">Strategy</th><th scope="col" class="num">Cost</th><th scope="col" class="num">Value</th><th scope="col" class="num">PnL</th><th scope="col" class="num">%</th><th scope="col" class="num">Price</th><th scope="col" class="num">Peak</th><th scope="col">Rank</th><th scope="col">Held</th><th scope="col">HP</th><th scope="col">Exit</th></tr></thead><tbody>${pos.map((p) => {
    const rank = M.ranked.find((r) => r.id === p.id)?.rank;
    const hpv = p.hp && p.hp.max ? p.hp.hp / p.hp.max : null;
    const exit = p.kind === 'top' ? (rank ? `rank ${rank} / ${S.P.topExit}` : 'out of the ranking') : p.kind === 'manuel' ? '15% trail' : p.kind === 'crash' || p.kind === 'dip' ? `${Math.round((S.P.dipHold || 0) / 60e3)} min or run` : '';
    return `<tr><td>${esc(p.name)}</td><td>${stag(p.kind === 'dip' ? 'crash' : p.kind)}</td><td class="num">${cx(p.cost)}</td><td class="num">${cx(p.value)}</td><td class="num ${cls(p.pnl)}">${cxs(p.pnl)}</td><td class="num ${cls(p.pct)}">${pct(p.pct)}</td><td class="num">${cx(p.p)}</td><td class="num">${cx(p.peak)}</td><td>${rank ? '#' + rank : '-'}</td><td>${p.since ? dur(now - p.since) : '-'}</td><td>${hpv == null ? '<span class="mut">-</span>' : `<span class="hpbar" data-tip="${p.hp.hp}/${p.hp.max} HP${p.hp.out ? ', outside the zone' : ''}"><i style="width:${hpv * 100}%;background:var(--${hpv < .25 ? 'critical' : hpv < .5 ? 'warning' : 'good'})"></i></span>`}</td><td class="mut">${esc(exit)}</td></tr>`;
  }).join('')}</tbody></table></div>` : empty('No open position')));

  // Strategies
  const order = ['top', 'crash', 'surv', 'mom', 'dip', 'manuel'];
  const rows = Object.entries(S.byStrat).sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0])).map(([k, s]) => ({ label: stag(k), v: s.pnl, color: scol(k), tip: `${STRATS[k] || k}: ${s.n} round trips, ${s.wins} winners (${Math.round(s.wins / s.n * 100)}%)\nbest ${cxs(s.best)} Cx, worst ${cxs(s.worst)} Cx` }));
  set('m-stratpnl', card('target', 'PnL by strategy', 'closed round trips, Cx', divBars(rows, (v) => cxs(v)) + (rows.length ? `<div class="tbl-wrap" tabindex="0" style="margin-top:10px"><table><thead><tr><th scope="col">Strategy</th><th scope="col" class="num">Closed</th><th scope="col" class="num">Winners</th><th scope="col" class="num">Average</th></tr></thead><tbody>${Object.entries(S.byStrat).map(([k, s]) => `<tr><td>${stag(k)}</td><td class="num">${s.n}</td><td class="num">${Math.round(s.wins / s.n * 100)}%</td><td class="num ${cls(s.pnl)}">${cxs(s.pnl / s.n)}</td></tr>`).join('')}</tbody></table></div>` : '')));
  set('m-trial', card('shield-check', 'Kill switches', '10 round trips', `<div class="list">${['top', 'crash', 'surv'].map((k) => {
    const t = S.trial[k]; const st = t.disabled ? ['warning', 'disabled by the tuner'] : t.off ? ['critical', 'switched off'] : ['good', 'active'];
    return `<div class="li"><span class="grow">${stag(k)}</span>${status(st[0], st[1])}<span class="mut" data-tip="round trips since the last re-arm">${t.n}/10 · <span class="${cls(t.pnl)}">${cxs(t.pnl)}</span></span></div>`;
  }).join('')}</div>`));
  const br = M.lastBreadth ?? 0;

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip'); if (!b) return;
  const g = b.closest('[data-group]').dataset.group; ui[g] = b.dataset.v; render();
});

// ---------- live connection
const dot = document.getElementById('livedot');
function showErr(t) { const e = document.getElementById('err'); e.style.display = t ? 'flex' : 'none'; document.getElementById('err-text').textContent = t || ''; }
function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('state', (m) => { S = JSON.parse(m.data); S._recv = Date.now(); dot.classList.add('on'); dot.title = 'connected'; showErr(S.error ? `Server-side error: ${S.error}` : ''); if (!S.error) render(); });
  es.addEventListener('reload', () => location.reload());
  es.onerror = () => { dot.classList.remove('on'); dot.title = 'disconnected'; showErr('Lost the connection to the engine. Retrying by itself.'); };
}
